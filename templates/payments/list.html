{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Payments</h2>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>Payment ID</th>
                <th>Amount</th>
                <th>Payment Date</th>
                <th>Payment Status</th>
            </tr>
        </thead>
        <tbody>
            {% for payment in payments %}
            <tr>
                <td>{{ payment.payment_id }}</td>
                <td>{{ payment.payment_amount }}</td>
                <td>{{ payment.payment_date_utc }}</td>
                <td><span class="badge bg-secondary">{{ payment.payment_status_code }}</span></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
