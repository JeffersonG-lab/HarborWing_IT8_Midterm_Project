{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Booking Agents</h2>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>Agent ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Agency Name</th>
            </tr>
        </thead>
        <tbody>
            {% for agent in agents %}
            <tr>
                <td>{{ agent.agent_id }}</td>
                <td>{{ agent.first_name }}</td>
                <td>{{ agent.last_name }}</td>
                <td>{{ agent.agency_name }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
