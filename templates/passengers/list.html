{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Passengers</h2>
    <a href="/passengers/create" class="btn btn-primary">+ Add New Passenger</a>
</div>

<form method="GET" action="/passengers" class="mb-4">
    <div class="input-group">
        <input type="text" name="search" class="form-control" placeholder="Search by name or email..." value="{{ search }}">
        <button class="btn btn-outline-secondary" type="submit">Search</button>
    </div>
</form>

<table class="table table-striped table-hover bg-white rounded shadow-sm">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>City</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for p in passengers %}
        <tr>
            <td>{{ p.passenger_id }}</td>
            <td>{{ p.first_name }} {{ p.last_name }}</td>
            <td>{{ p.email_address }}</td>
            <td>{{ p.phone_number }}</td>
            <td>{{ p.city }}</td>
            <td>
                <form action="/passengers/delete/{{ p.passenger_id }}" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure?');">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
